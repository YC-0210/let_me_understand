<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wink guide — three reveal prototypes</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* THROWAWAY PROTOTYPE: Three Wink-led reveals, switchable via ?variant=A, B, or C. */
:root{
  color-scheme:dark;
  --canvas:#010102; --s1:#0f1011; --s2:#141516; --s3:#18191a;
  --hair:#23252a; --hair-strong:#34343a;
  --ink:#f7f8f8; --muted:#d0d6e0; --subtle:#8a8f98; --tert:#62666d;
  --accent:#5e6ad2; --accent-hi:#828fff; --ok:#27a644;
  --sans:"Inter",-apple-system,system-ui,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",monospace;
}
*{box-sizing:border-box}
html{background:var(--canvas)}
body{margin:0; min-height:100vh; background:var(--canvas); color:var(--ink);
  font:16px/1.5 var(--sans); -webkit-font-smoothing:antialiased}
button{font:inherit}
[hidden]{display:none!important}
.page{width:min(820px,calc(100% - 48px)); margin:0 auto; padding:48px 0 112px}
.eyebrow{display:block; margin-bottom:8px; color:var(--subtle); font-size:11px;
  font-weight:600; letter-spacing:.08em; text-transform:uppercase}
h1{max-width:730px; margin:0; font-size:clamp(27px,4vw,34px); font-weight:600;
  line-height:1.13; letter-spacing:-.035em}
.section-head{margin-bottom:28px}
.section-head p{max-width:57ch; margin:13px 0 0; color:var(--muted); font-size:16px}

/* The same mascot and palette as the latest committed Mix and Match prototype. */
.wink{display:block; width:72px; height:72px; overflow:visible; filter:drop-shadow(0 10px 22px #0008)}
.wk-body{fill:#f5f0ff}.wk-eye{fill:#4b3869}.wk-wink{fill:none; stroke:#4b3869;
  stroke-width:3.2; stroke-linecap:round}.wk-spark{fill:#b491f5}
.wk-breathe{transform-box:view-box; transform-origin:50px 50px; animation:breathe 3.1s ease-in-out infinite}
.wk-bob{transform-box:view-box; transform-origin:50px 50px; animation:bob 4.3s ease-in-out infinite}
.wk-spark{transform-box:fill-box; transform-origin:center; animation:twinkle 1.7s ease-in-out infinite}
.wink-svg.nod{animation:nod .42s cubic-bezier(.22,.9,.3,1)}
.wink-svg.look-down .wk-face{transform:translateY(3px)}
.wk-face{transition:transform .45s cubic-bezier(.22,.9,.3,1)}
@keyframes breathe{50%{transform:scale(1.025)}}
@keyframes bob{50%{transform:translateY(-1.5px)}}
@keyframes twinkle{0%,100%{opacity:.55;transform:scale(.88)}50%{opacity:1;transform:scale(1.12)}}
@keyframes nod{35%{transform:translateY(2px) scale(1.05,.95)}}

.guide{position:relative; min-height:222px}
.intro{position:relative; min-height:222px; border:1px solid var(--hair); border-radius:18px;
  overflow:hidden; background:linear-gradient(145deg,#111214,#09090a)}
.intro-inner{position:relative; z-index:2}
.speech{color:var(--muted); font-size:15px; line-height:1.55}
.speech strong{color:var(--ink); font-weight:600}
.primary{display:inline-flex; align-items:center; gap:9px; padding:9px 14px; color:white;
  background:var(--accent); border:0; border-radius:8px; cursor:pointer; font-weight:600;
  font-size:13px; box-shadow:0 5px 18px #5e6ad238; transition:background .18s,transform .18s}
.primary:hover{background:var(--accent-hi); transform:translateY(-1px)}
.primary:focus-visible,.choice:focus-visible,.opt:focus-visible,.proto-switch button:focus-visible{
  outline:2px solid var(--accent-hi); outline-offset:3px}
.primary .arrow{font-size:17px; line-height:1}
.reset{position:absolute; z-index:5; top:12px; right:12px; padding:6px 9px; color:var(--subtle);
  border:1px solid var(--hair); border-radius:7px; background:#0b0b0ce6; cursor:pointer;
  font-size:11px; opacity:0; pointer-events:none; transition:opacity .2s}
.guide[data-state="ready"] .reset{opacity:1; pointer-events:auto}

/* Shared destination. The drawing stays absent from layout until Wink summons it. */
.visual-wrap[hidden]{display:none}
.visual-wrap{margin-top:16px; opacity:0; transform:translateY(18px) scale(.985)}
.visual-wrap.enter{animation:panel-in .75s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes panel-in{to{opacity:1;transform:none}}
.knobs{display:flex; flex-wrap:wrap; gap:22px; margin:0 0 14px}
.knob{display:grid; gap:7px}.knob-label{color:var(--subtle); font-size:10px;
  font-weight:600; letter-spacing:.08em}.options{display:flex; flex-wrap:wrap; gap:6px}
.opt{padding:6px 10px; color:var(--subtle); border:1px solid var(--hair); border-radius:7px;
  background:var(--s1); cursor:pointer; font-size:12px}
.opt[aria-pressed="true"]{color:var(--ink); border-color:var(--accent); background:var(--s2)}
.viz{position:relative; overflow:hidden; min-height:286px; padding:22px 22px 14px;
  border:1px solid var(--hair); border-radius:16px; background:var(--s1)}
.drawing{display:block; width:100%; height:auto; overflow:visible}
.mark{fill:#141516;stroke:#34343a;stroke-width:2}.mark-core{fill:#23252a}.label{fill:#d0d6e0;
  font:500 12px var(--sans)}.caption{fill:#62666d;font:10px var(--mono);letter-spacing:.04em}
.path{fill:none;stroke:#34343a;stroke-width:1.5}.path.live{stroke:var(--accent)}
.packet{fill:var(--accent);filter:drop-shadow(0 0 7px #5e6ad2)}
.viz-meta{display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
  min-height:59px; margin-top:5px; padding-top:10px; border-top:1px solid var(--hair)}
.dock{display:flex; align-items:center; gap:10px; min-height:48px; min-width:0}
.dock .wink{width:43px;height:43px;filter:none}.dock-copy{color:var(--subtle);font-size:12px}
.dock-copy b{display:block;color:var(--muted);font-weight:500}
.play{flex:none;padding:7px 11px;color:var(--muted);background:transparent;border:1px solid var(--hair);
  border-radius:7px;font-size:12px}

/* A — a quiet briefing. Content follows a single explicit invitation. */
.variant-a .intro{display:grid; place-items:center; text-align:center}
.variant-a .intro-inner{display:grid; justify-items:center; width:min(520px,calc(100% - 40px)); padding:27px}
.variant-a .speech{margin:12px 0 17px}
.variant-a .intro::after{content:"";position:absolute;width:300px;height:180px;border-radius:50%;
  background:#5e6ad214;filter:blur(30px)}

/* B — Wink points to a path; following it draws the explanation into view. */
.variant-b .intro{display:grid;grid-template-columns:150px 1fr;align-items:center;padding:28px 34px}
.variant-b .intro-inner{display:contents}.variant-b .mascot-slot{position:relative;z-index:2}
.variant-b .speech{max-width:46ch;margin:0 0 15px}.variant-b .intro-copy{position:relative;z-index:2}
.route-preview{position:absolute;inset:auto 22px 16px 22px;height:5px;border-radius:99px;background:#23252a;
  overflow:hidden}.route-preview::after{content:"";display:block;width:38%;height:100%;background:var(--accent);
  animation:scan 2.5s ease-in-out infinite}@keyframes scan{50%{transform:translateX(165%)}}
.variant-b .visual-wrap.enter .path{stroke-dasharray:500;stroke-dashoffset:500;animation:draw-path 1s .2s ease forwards}
@keyframes draw-path{to{stroke-dashoffset:0}}

/* C — progressive choice: Wink asks what the reader wants to notice first. */
.variant-c .intro{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;padding:30px 34px}
.variant-c .intro-inner{display:contents}.variant-c .speech{margin:2px 0 14px;max-width:49ch}
.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{padding:8px 11px;color:var(--muted);
  background:var(--s2);border:1px solid var(--hair-strong);border-radius:99px;cursor:pointer;font-size:12px}
.choice:hover{border-color:var(--accent);color:var(--ink)}
.variant-c .visual-wrap.enter{animation-name:unmask;clip-path:inset(0 0 100% 0 round 16px)}
@keyframes unmask{to{opacity:1;transform:none;clip-path:inset(0 0 0 0 round 16px)}}

/* Throwaway switcher: shareable URL, arrows, keyboard, and exposed state. */
.proto-switch{position:fixed;z-index:50;left:50%;bottom:16px;transform:translateX(-50%);
  display:flex;align-items:center;gap:5px;padding:5px;background:#171719f2;border:1px solid #3a3a40;
  border-radius:999px;box-shadow:0 14px 44px #000b;backdrop-filter:blur(16px)}
.proto-switch button{display:grid;place-items:center;width:31px;height:31px;padding:0;color:var(--muted);
  border:0;border-radius:50%;background:transparent;cursor:pointer}.proto-switch button:hover{background:#242428;color:white}
.proto-label{min-width:190px;text-align:center;color:var(--ink);font-size:12px;font-weight:600}
.proto-label small{display:block;color:var(--tert);font:9px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.08em}

@media(max-width:600px){
  .page{width:min(100% - 28px,820px);padding-top:28px}.section-head{margin-bottom:20px}
  .variant-b .intro,.variant-c .intro{grid-template-columns:1fr;padding:24px;text-align:center;justify-items:center}
  .variant-b .intro-inner,.variant-c .intro-inner{display:contents}.variant-b .speech,.variant-c .speech{margin-inline:auto}
  .choices{justify-content:center}.route-preview{display:none}.viz{padding:16px 12px 12px}.drawing{margin-top:10px}
  .proto-label{min-width:150px}.label{font-size:10px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  .wk-face{transition:none}
}
</style>
</head>
<body>
<main class="page">
  <header class="section-head">
    <span class="eyebrow">Prototype · part 2 · Wink as guide</span>
    <h1>Change the server. Change the framework. The thing in between does not move.</h1>
  </header>

  <section class="guide" id="guide" aria-label="Wink-guided visualization">
    <button class="reset" id="reset" type="button">↺ Replay entrance</button>
    <div class="intro" id="intro"></div>

    <div class="visual-wrap" id="visual" hidden>
      <div class="knobs">
        <div class="knob"><span class="knob-label">SERVER</span><div class="options">
          <button class="opt" aria-pressed="true">the article’s server</button><button class="opt" aria-pressed="false">gunicorn</button><button class="opt" aria-pressed="false">waitress</button>
        </div></div>
        <div class="knob"><span class="knob-label">FRAMEWORK</span><div class="options">
          <button class="opt" aria-pressed="true">a bare WSGI app</button><button class="opt" aria-pressed="false">Flask</button><button class="opt" aria-pressed="false">Django</button>
        </div></div>
      </div>
      <div class="viz">
        <svg class="drawing" viewBox="0 0 740 202" role="img" aria-label="A request travelling from you to a server to a framework application and back">
          <path class="path" d="M113 91 C185 41 250 41 309 91"/>
          <path class="path live" d="M381 91 C458 41 535 41 605 91"/>
          <path class="path" d="M605 111 C535 160 458 160 381 111"/>
          <path class="path" d="M309 111 C250 160 185 160 113 111"/>
          <circle class="mark" cx="76" cy="101" r="36"/><circle class="mark-core" cx="76" cy="101" r="11"/>
          <circle class="mark" cx="345" cy="101" r="36"/><circle class="mark-core" cx="345" cy="101" r="11"/>
          <circle class="mark" cx="641" cy="101" r="36"/><circle class="mark-core" cx="641" cy="101" r="11"/>
          <circle class="packet" cx="493" cy="57" r="5"/>
          <text class="label" x="76" y="159" text-anchor="middle">you</text>
          <text class="label" x="345" y="159" text-anchor="middle">server</text>
          <text class="label" x="641" y="159" text-anchor="middle">application</text>
          <text class="caption" x="211" y="22" text-anchor="middle">a network connection</text>
          <text class="caption" x="493" y="22" text-anchor="middle">application(environ, start_response)</text>
        </svg>
        <div class="viz-meta">
          <div class="dock" id="dock"></div>
          <button class="play" type="button">▶ Play exchange</button>
        </div>
      </div>
    </div>
  </section>
</main>

<nav class="proto-switch" aria-label="Prototype variants">
  <button id="previous" aria-label="Previous variant">←</button>
  <div class="proto-label" id="variantLabel"></div>
  <button id="next" aria-label="Next variant">→</button>
</nav>

<template id="winkTemplate">
  <div class="wink" id="wink">
    <svg class="wink-svg" viewBox="0 0 100 100" aria-hidden="true">
      <g class="wk-bob"><g class="wk-breathe">
        <circle class="wk-body" cx="50" cy="50" r="46"/>
        <g class="wk-face"><g transform="rotate(-10 38.04 45.4)"><ellipse class="wk-eye" cx="38.04" cy="45.4" rx="5.98" ry="9.2"/></g>
          <path class="wk-wink" d="M59.2 42.6 Q67 54.6 74.8 42.6"/></g>
        <g transform="translate(76.2 16.9)"><path class="wk-spark" d="M0,-6.2 Q0.9,-1.5 5.2,0 Q0.9,1.5 0,6.2 Q-0.9,1.5 -5.2,0 Q-0.9,-1.5 0,-6.2 Z"/></g>
      </g></g>
    </svg>
  </div>
</template>

<script>
const VARIANTS = {
  A:{name:'Quiet briefing', className:'variant-a'},
  B:{name:'Follow the request', className:'variant-b'},
  C:{name:'Choose your lens', className:'variant-c'},
};
const keys = Object.keys(VARIANTS);
const params = new URLSearchParams(location.search);
let variant = (params.get('variant') || 'A').toUpperCase();
if (!VARIANTS[variant]) variant = 'A';
let state = 'intro';
const guide = document.querySelector('#guide');
const intro = document.querySelector('#intro');
const visual = document.querySelector('#visual');
const dock = document.querySelector('#dock');
const label = document.querySelector('#variantLabel');

function newWink(){ return document.querySelector('#winkTemplate').content.cloneNode(true).firstElementChild; }

function introMarkup(key){
  const wink = newWink();
  const slot = document.createElement('div'); slot.className = 'mascot-slot'; slot.appendChild(wink);
  const copy = document.createElement('div'); copy.className = 'intro-copy';
  if (key === 'A') copy.innerHTML = `
    <p class="speech"><strong>I’ll show you one real request.</strong><br>Swap the server or framework, then watch the call between them stay the same.</p>
    <button class="primary reveal" type="button">Show me the exchange <span class="arrow">↓</span></button>`;
  if (key === 'B') copy.innerHTML = `
    <p class="speech"><strong>Follow the request with me.</strong><br>The view below traces what travels over the network, then what crosses into the framework.</p>
    <button class="primary reveal" type="button">Follow the request <span class="arrow">→</span></button>`;
  if (key === 'C') copy.innerHTML = `
    <p class="speech"><strong>What do you want to notice first?</strong><br>This compares server–framework pairs while visualizing the same request moving through both.</p>
    <div class="choices"><button class="choice reveal" data-lens="constant">What stays the same</button><button class="choice reveal" data-lens="change">What changes</button></div>`;
  const inner = document.createElement('div'); inner.className = 'intro-inner'; inner.append(slot,copy);
  return inner;
}

function setState(next){ state = next; guide.dataset.state = state; updateLabel(); }

function render(){
  document.body.className = VARIANTS[variant].className;
  intro.replaceChildren(introMarkup(variant));
  intro.hidden = false; visual.hidden = true; visual.classList.remove('enter'); dock.replaceChildren();
  setState('intro');
  label.innerHTML = `${variant} · ${VARIANTS[variant].name}<small>state · ${state}</small>`;
  const normalized = new URL(location.href); normalized.searchParams.set('variant',variant);
  history.replaceState(null,'',normalized);
}

function moveWinkToDock(wink){
  const first = wink.getBoundingClientRect(); dock.prepend(wink);
  const last = wink.getBoundingClientRect();
  const dx = first.left-last.left, dy = first.top-last.top;
  wink.animate([
    {transform:`translate(${dx}px,${dy}px) scale(1.65)`,zIndex:10},
    {transform:'translate(0,0) scale(1)',zIndex:10}
  ],{duration:760,easing:'cubic-bezier(.2,.8,.2,1)'});
  const copy = document.createElement('span'); copy.className='dock-copy';
  copy.innerHTML = variant === 'C' ? '<b>Good lens.</b> Try the other controls too.' : '<b>I’ll stay here.</b> Play or scrub at your pace.';
  dock.append(copy);
}

function reveal(trigger){
  if (state !== 'intro') return;
  setState('revealing');
  const wink = intro.querySelector('#wink');
  wink.querySelector('.wink-svg').classList.add('nod','look-down');
  if (variant === 'C') {
    const lens = trigger.dataset.lens;
    const target = [...document.querySelectorAll('.opt')].find(x => lens === 'change' ? x.textContent === 'gunicorn' : x.textContent.includes('article'));
    if (target){ target.closest('.options').querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed','false')); target.setAttribute('aria-pressed','true'); }
  }
  window.setTimeout(()=>{
    visual.hidden=false; requestAnimationFrame(()=>visual.classList.add('enter'));
    moveWinkToDock(wink);
    intro.animate([{opacity:1},{opacity:0,transform:'translateY(-8px)'}],{duration:360,fill:'forwards'}).finished.then(()=>{intro.hidden=true;setState('ready')});
  }, variant === 'B' ? 320 : 180);
}

function updateLabel(){ label.innerHTML = `${variant} · ${VARIANTS[variant].name}<small>state · ${state}</small>`; }
function cycle(delta){ variant = keys[(keys.indexOf(variant)+delta+keys.length)%keys.length]; render(); }
intro.addEventListener('click',e=>{const trigger=e.target.closest('.reveal');if(trigger)reveal(trigger)});
document.querySelector('#reset').addEventListener('click',render);
document.querySelector('#previous').addEventListener('click',()=>cycle(-1));
document.querySelector('#next').addEventListener('click',()=>cycle(1));
document.addEventListener('click',e=>{const opt=e.target.closest('.opt');if(!opt)return;opt.closest('.options').querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed','false'));opt.setAttribute('aria-pressed','true')});
addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
render();
</script>
</body>
</html>
